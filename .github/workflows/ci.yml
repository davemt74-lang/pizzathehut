name: Pizza Lab CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-validation:
    name: PHP ${{ matrix.php }} and Node contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, sodium, pdo_mysql, fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run local contract checks
        run: sh tests/verify-local.sh
      - name: Ensure no secrets or customer uploads are committed
        run: |
          test ! -e config.php
          test ! -d private/uploads
          ! git ls-files | grep -E '(^|/)(\.env|config\.php|.*\.pem|.*\.key)$|^private/uploads/'
      - name: Check PHP files for syntax errors
        run: |
          find . -name '*.php' -type f -print0 | xargs -0 -n1 php -l
  deploy-archive:
    name: Deployment ZIP and SHA-256
    needs: source-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked application files
        run: |
          set -eu
          git ls-files | grep -Ev '^(\.github/|tests/|\.gitignore$)' > /tmp/pizza-lab-deploy-files.txt
          test -s /tmp/pizza-lab-deploy-files.txt
          zip -q pizza-lab-v1.5.11-deploy.zip -@ < /tmp/pizza-lab-deploy-files.txt
          unzip -tq pizza-lab-v1.5.11-deploy.zip
          unzip -Z1 pizza-lab-v1.5.11-deploy.zip | grep -q '^agent_chat.php$'
          unzip -Z1 pizza-lab-v1.5.11-deploy.zip | grep -q '^assets/agent_chat_camera.js$'
          unzip -Z1 pizza-lab-v1.5.11-deploy.zip | grep -q '^assets/agent_chat_nav.js$'
          unzip -Z1 pizza-lab-v1.5.11-deploy.zip | grep -q '^assets/agent_chat_commands.js$'
          unzip -Z1 pizza-lab-v1.5.11-deploy.zip | grep -q '^ai_experiments.php$'
          unzip -Z1 pizza-lab-v1.5.11-deploy.zip | grep -q '^assets/agent_chat_account.js$'
          unzip -Z1 pizza-lab-v1.5.11-deploy.zip | grep -q '^account_lib.php$'
          unzip -Z1 pizza-lab-v1.5.11-deploy.zip | grep -q '^upgrade.php$'
          if unzip -Z1 pizza-lab-v1.5.11-deploy.zip | grep -Eq '(^|/)(config\.php|\.env|private/uploads/)'; then
            echo 'Forbidden secret or private upload included in release' >&2
            exit 1
          fi
          sha256sum pizza-lab-v1.5.11-deploy.zip > pizza-lab-v1.5.11-deploy.sha256
          sha256sum -c pizza-lab-v1.5.11-deploy.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pizza-lab-v1.5.11-deployment
          path: |
            pizza-lab-v1.5.11-deploy.zip
            pizza-lab-v1.5.11-deploy.sha256
          if-no-files-found: error
          retention-days: 90
